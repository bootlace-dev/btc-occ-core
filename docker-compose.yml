version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: btc-occ-core-postgres
    environment:
      POSTGRES_USER: occ_admin
      POSTGRES_PASSWORD: occ_secure_password
      POSTGRES_DB: occ_ledger_prod
    ports:
      - "5432:5432"
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c track_io_timing=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./priv/repo/migrations/20260924000001_create_core_ledger_tables.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
